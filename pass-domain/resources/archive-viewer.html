<!DOCTYPE html>
<!--
  Proton Pass - offline archive viewer template.

  This file is the sole source of the viewer HTML/CSS/JS. It is embedded at
  compile time by pass-cli (include_str!) and filled in by
  pass-domain/src/archive/viewer.rs.

  Iterating on the viewer: edit this file, then rebuild pass-cli (or run
  `cargo test -p pass-cli archive`). No HTML tooling required.

  Placeholders replaced at export time (do not rename; matched verbatim):
    <!--{{META_JSON}}-->    JSON metadata object (comment is replaced by the JSON in a <script> tag)
    <!--{{PAYLOAD_JSON}}--> archive payload JSON, or the encrypted envelope JSON
    <!--{{KDF_JS}}-->       inlined pure-JS Argon2id bundle

  Styling mirrors the Proton Pass web app (design tokens extracted from
  pass.proton.black, light and dark themes). All icons come from the inline SVG sprite defined in
  <body> (referenced via <use href="#ic-...">) — the file is fully
  self-contained with no external URLs.

  To preview locally, replace the placeholders by hand with:
    META_JSON    = {"encrypted":false,"exported_at":"2026-01-01T00:00:00Z",
                    "has_attachments":false,"item_count":1,"vault_count":1}
    PAYLOAD_JSON = a valid archive payload (ArchiveData in model.rs)
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proton Pass - Offline Archive</title>
<script>
// Apply theme before first paint: stored preference, else system preference.
(function () {
  var pref = null;
  try { pref = localStorage.getItem("pp-archive-theme"); } catch (e) {}
  var dark = pref === "dark" || (pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  if (dark) document.documentElement.setAttribute("data-theme", "dark");
})();
</script>
<style>
:root {
  /* Proton Pass light theme tokens (default) */
  --text-norm: #2b2442;
  --text-weak: #52527a;
  --text-hint: #999999;
  --background-norm: #fbf9fe;
  --background-weak: #ffffff;
  --background-strong: #f4f0fe;
  --interaction-norm: #5817d1;
  --interaction-norm-hover: #6a2fd9;
  --interaction-norm-minor-2: #eee8fa;
  --interaction-weak: #ece5ff;
  --interaction-weak-hover: #e0daf2;
  --interaction-default-hover: rgba(194, 194, 194, 0.2);
  --interaction-default-active: rgba(194, 194, 194, 0.4);
  --navigation-current-item-background-color: #ffffff;
  --field-background: #ffffff;
  --focus-outline: #4612a7;
  --focus-ring: #ded1f6;
  --search-focus-bg: #ffffff;
  --vault-heliotrope: #8849ff;
  --border-norm: #9994d1;
  --border-weak: #e3dffa;
  --danger: #cc2d4f;
  --warning: #e65200;
  --success: #007b58;
  --primary: #8a6eff;
  --fieldset-icon: #6d4aff;
  --folder-icon: #e9a944;
  --shadow-color: rgba(43, 36, 66, 0.16);
  --hover-weak: rgba(0, 0, 0, 0.04);
  --hover-strong: rgba(0, 0, 0, 0.06);
  --on-interaction-norm: #ffffff;
  --crumb-bg: #f8ecd2;
  --crumb-fg: #8a6100;
  --font-weight-bold: 700;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 14px;
  --sidebar-w: clamp(240px, 22vw, 320px);
  --list-w: clamp(300px, 34vw, 454px);
  color-scheme: light;
}

/* Proton Pass dark theme tokens (extracted from pass.proton.black dark mode) */
html[data-theme="dark"] {
  --text-norm: #ffffff;
  --text-weak: #bfb9d8;
  --text-hint: #9a97b2;
  --background-norm: #1f1f31;
  --background-weak: #282839;
  --background-strong: #191926;
  --interaction-norm: #b6b6ff;
  --interaction-norm-hover: #bdbdff;
  --interaction-norm-minor-2: #37374d;
  --interaction-weak: #302d45;
  --interaction-weak-hover: #454258;
  --interaction-default-hover: rgba(255, 255, 255, 0.04);
  --interaction-default-active: rgba(255, 255, 255, 0.08);
  --navigation-current-item-background-color: #302d45;
  --field-background: #1c1c2c;
  --focus-outline: #c5c5ff;
  --focus-ring: #5b5b80;
  --search-focus-bg: #0e0e0e;
  --vault-heliotrope: #8849ff;
  --border-norm: #7a7aad;
  --border-weak: #38384c;
  --danger: #f08fa4;
  --warning: #ffb84d;
  --success: #4ab89a;
  --primary: #7777f8;
  --fieldset-icon: #b6b6ff;
  --shadow-color: rgba(0, 0, 0, 0.45);
  --hover-weak: rgba(255, 255, 255, 0.04);
  --hover-strong: rgba(255, 255, 255, 0.08);
  --on-interaction-norm: #000000;
  --crumb-bg: rgba(233, 169, 68, 0.16);
  --crumb-fg: #ffcf87;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: "Inter", "InterVariable", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--background-norm);
  color: var(--text-norm);
  font-size: 14px;
  line-height: 20px;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
.hidden { display: none !important; }
.ico-16 { width: 16px; height: 16px; flex-shrink: 0; }
.ico-20 { width: 20px; height: 20px; flex-shrink: 0; }
.color-weak { color: var(--text-weak); }

/* ---------- buttons (Proton pill style) ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: none; cursor: pointer;
  border-radius: 24px;
  font: inherit; font-size: 14px; font-weight: 600;
  height: 36px; padding: 0 16px;
  transition: background .15s cubic-bezier(.42,0,.58,1), color .15s cubic-bezier(.42,0,.58,1);
  white-space: nowrap;
}
.btn-solid { background: var(--interaction-norm); color: var(--on-interaction-norm); }
.btn-solid:hover { background: var(--interaction-norm-hover); }
.btn-solid-weak { background: var(--interaction-weak); color: var(--interaction-norm); }
.btn-solid-weak:hover { background: var(--interaction-weak-hover); }
.btn-ghost { background: transparent; color: var(--text-norm); }
.btn-ghost:hover { background: var(--hover-strong); }
.btn-icon { width: 36px; padding: 0; }

/* ---------- lock screen ---------- */
.lock-screen {
  position: fixed; inset: 0; z-index: 100;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(180deg, var(--background-strong) 0%, var(--background-norm) 100%);
}
.lock-card {
  width: 380px; max-width: calc(100vw - 40px);
  background: var(--background-weak);
  border: 1px solid var(--border-weak);
  border-radius: var(--radius-lg);
  padding: 40px 32px;
  text-align: center;
  box-shadow: 0 12px 40px var(--shadow-color);
}
.lock-logo { display: flex; justify-content: center; margin-bottom: 18px; }
.lock-card h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
.lock-sub { color: var(--text-weak); margin-bottom: 24px; line-height: 1.5; }
.lock-card input {
  width: 100%; padding: 10px 12px;
  background: var(--background-weak); color: var(--text-norm);
  border: 1px solid var(--border-weak); border-radius: var(--radius-sm);
  font: inherit; font-size: 14px; outline: none; margin-bottom: 14px;
  transition: border-color .15s;
}
.lock-card input:focus { border-color: var(--interaction-norm); box-shadow: 0 0 0 1px var(--interaction-norm); }
.lock-error { color: var(--danger); margin-top: 14px; font-size: 14px; }
.lock-card .btn { width: 100%; }

/* ---------- app layout ---------- */
.app { display: flex; height: 100vh; }
.sidebar {
  width: var(--sidebar-w); min-width: var(--sidebar-w);
  background: var(--background-strong);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.brand {
  display: flex; align-items: center; gap: 10px;
  height: 60px; flex-shrink: 0;
  padding: 0 16px;
  font-weight: 700; font-size: 16px;
}
.brand-tag {
  font-size: 11px; font-weight: 600;
  color: var(--interaction-norm);
  background: var(--interaction-weak);
  border-radius: 4px; padding: 1px 6px;
  margin-left: auto;
}
/* Search bar: mirrors the web app's .pass-searchbar — rounded input sitting in the
   main header, magnifier prefix, clear (×) suffix, purple focus ring. */
.top-search {
  position: relative; flex: 1; min-width: 0;
  display: flex; align-items: center;
}
.top-search .input-shell {
  display: flex; align-items: stretch; flex: 1; min-width: 0;
  background: var(--background-strong);
  border: 1px solid var(--border-weak);
  border-radius: var(--radius-sm);
  transition: background .15s var(--ease), border-color .15s var(--ease), box-shadow .15s var(--ease);
}
.top-search .input-shell:focus-within {
  background: var(--search-focus-bg);
  border-color: var(--focus-outline);
  box-shadow: 0 0 0 3px var(--focus-ring);
}
.top-search .prefix-icon {
  display: inline-flex; align-items: center; flex-shrink: 0;
  padding-left: 12px; color: var(--text-norm);
}
.top-search .prefix-icon svg { width: 16px; height: 16px; }
.top-search input {
  flex: 1; min-width: 0;
  background: transparent; border: none; outline: none;
  padding: 6px 8px;
  font: inherit; font-size: 14px; color: var(--text-norm);
  text-overflow: ellipsis;
}
.top-search input::placeholder { color: var(--text-weak); }
.search-clear {
  display: none; align-items: center; justify-content: center; flex-shrink: 0;
  background: transparent; border: none; cursor: pointer;
  padding: 0 10px; color: var(--text-norm);
}
.search-clear svg { width: 16px; height: 16px; }
.top-search.has-text .search-clear { display: inline-flex; }
.filters { flex: 1; overflow-y: auto; padding: 0 12px 12px; }
.filters-title {
  display: flex; align-items: center;
  font-size: 14px; font-weight: 400;
  color: var(--text-weak);
  padding: 16px 10px 6px;
}
.filters-title.accent { color: var(--interaction-norm); }
.filter, .vault-item {
  display: flex; align-items: center; gap: 8px;
  width: 100%; text-align: left;
  padding: 8px;
  background: transparent; color: var(--text-norm);
  border: none; border-radius: var(--radius-sm);
  font: inherit; font-size: 14px; cursor: pointer;
  transition: background .15s;
}
.filter:hover { background: var(--interaction-default-hover); }
.filter.active { background: var(--navigation-current-item-background-color); }
.filter-icon { display: inline-flex; width: 16px; height: 16px; color: var(--text-weak); flex-shrink: 0; }
.filter-icon svg { width: 16px; height: 16px; display: block; }

/* Icons inherit color from the surrounding element (like Proton's design system).
   Without this, sprite paths paint solid black and vanish on the dark background. */
svg { fill: currentColor; }

.filter.active .filter-icon { color: var(--interaction-norm); }
.count { margin-left: auto; font-size: 12px; color: var(--text-hint); font-weight: 400; }
/* Sidebar rows: two lines (name + "N items") with a 32px tinted icon chip,
   mirroring the web app's vault submenu entries. */
.filter.has-chip { min-height: 54px; padding: 8px; gap: 10px; align-items: center; }
.filter.has-chip .filter-icon { display: none; }
.row-chip {
  width: 32px; height: 32px; min-width: 32px;
  border-radius: 14px;
  display: inline-flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.row-chip svg { width: 16px; height: 16px; display: block; }
/* Type-tinted chips for the sidebar (same palette as the list item icons) */
.row-chip.ui-violet { background: #ecdffa; color: #8849ff; }
.row-chip.ui-gray   { background: #ececec; color: #666666; }
.row-chip.ui-orange { background: #f0ebdb; color: #a07830; }
.row-chip.ui-teal   { background: #dbf0ed; color: #007d68; }
.row-chip.ui-red    { background: #fadfdf; color: #cc2d4f; }
.row-chip.ui-blue   { background: #ddeefa; color: #0072b8; }
.row-chip.ui-green  { background: #ddf5e8; color: #007b58; }
html[data-theme="dark"] .row-chip.ui-violet { background: #37305c; color: #d3adf7; }
html[data-theme="dark"] .row-chip.ui-gray   { background: #3d3d52; color: #c8c8d4; }
html[data-theme="dark"] .row-chip.ui-orange { background: #4d4033; color: #e8c890; }
html[data-theme="dark"] .row-chip.ui-teal   { background: #254944; color: #7fd4c4; }
html[data-theme="dark"] .row-chip.ui-red    { background: #502a38; color: #f09aae; }
html[data-theme="dark"] .row-chip.ui-blue   { background: #28425c; color: #90c4ec; }
html[data-theme="dark"] .row-chip.ui-green  { background: #245140; color: #8fdcbb; }
/* Vault chips: --chip holds the vault color as an "r,g,b" triple; color-mix
   keeps the tint correct in both themes without recomputing on toggle. */
.row-chip.vault {
  background: color-mix(in srgb, rgb(var(--chip, 136 73 255)) 18%, var(--background-norm));
  color: color-mix(in srgb, rgb(var(--chip, 136 73 255)) 80%, var(--text-norm));
}
html[data-theme="dark"] .row-chip.vault {
  background: color-mix(in srgb, rgb(var(--chip, 136 73 255)) 30%, var(--background-norm));
  color: color-mix(in srgb, rgb(var(--chip, 136 73 255)) 60%, #ffffff);
}
.nav-labels { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.nav-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-sub { color: var(--text-weak); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.folder-rows .filter { height: 36px; }
.folder-chevron {
  display: inline-flex; width: 16px; height: 16px;
  color: var(--text-weak);
  flex-shrink: 0;
}
.folder-chevron svg { width: 16px; height: 16px; display: block; }
.folder-icon { display: inline-flex; width: 16px; height: 16px; color: var(--folder-icon); flex-shrink: 0; }
.folder-icon svg { width: 16px; height: 16px; display: block; }
.folder-children { margin-top: 2px; }
.sidebar-footer {
  padding: 12px 16px; border-top: 1px solid var(--border-weak);
  font-size: 12px; color: var(--text-hint); line-height: 1.6;
  flex-shrink: 0;
}

/* ---------- main ---------- */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--background-norm); }
.item-list-header {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border-weak);
  min-height: 51px;
}
.item-list-header h2 { font-size: 16px; font-weight: 600; }
.list-count { color: var(--text-hint); font-size: 12px; }
/* Toolbar above the item list (web app layout): scope title + type-filter pills.
   Lives inside .list-col so it never pushes the detail pane down. */
.list-col {
  display: flex; flex-direction: column;
  width: var(--list-w); min-width: 280px; min-height: 0;
  border-right: 1px solid var(--border-weak);
  background: var(--background-norm);
  flex-shrink: 0;
}
.list-toolbar {
  display: flex; flex-direction: column; gap: 8px;
  padding: 10px 12px 8px;
  border-bottom: 1px solid var(--border-weak);
  flex-shrink: 0;
}
.toolbar-top { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.toolbar-top h2 { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.type-pills { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.type-pills::-webkit-scrollbar { display: none; }
.type-pills button {
  display: inline-flex; align-items: center; gap: 6px;
  height: 32px; flex-shrink: 0;
  padding: 6px 8px;
  background: var(--interaction-weak);
  color: var(--interaction-norm);
  border: none; border-radius: 8px;
  font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
  transition: background .15s;
}
.type-pills button:hover { background: var(--interaction-weak-hover); }
.type-pills button svg { width: 16px; height: 16px; }
.icon-btn {
  background: transparent; color: var(--text-norm);
  border: none; cursor: pointer; padding: 8px;
  border-radius: var(--radius-sm);
  display: inline-flex;
}
.icon-btn:hover { background: var(--hover-strong); }
.body-row { flex: 1; display: flex; min-height: 0; }

.item-list {
  flex: 1; min-height: 0; min-width: 0;
  overflow-y: auto;
  padding: 4px 0 12px;
  background: var(--background-norm);
}
.item-card {
  display: flex; align-items: center; gap: 12px;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  user-select: none;
  transition: background .15s;
}
.item-card:hover { background: var(--hover-weak); }
.item-card.active { background: var(--interaction-weak); }
.item-icon {
  width: 36px; height: 36px; min-width: 36px;
  border-radius: var(--radius-md);
  display: flex; align-items: center; justify-content: center;
  color: var(--interaction-norm);
}
.item-icon svg { width: 20px; height: 20px; }
.item-icon.ui-violet { background: #ecdffa; }
.item-icon.ui-gray { background: #ececec; }
.item-icon.ui-orange { background: #f0ebdb; }
.item-icon.ui-teal { background: #dbf0ed; }
.item-icon.ui-red { background: #fadfdf; }
.item-icon.ui-blue { background: #ddeefa; }
.item-icon.ui-green { background: #ddf5e8; }

/* Dark mode: dark-tinted icon chips with light glyphs for readability */
html[data-theme="dark"] .item-icon { color: #ffffff; }
html[data-theme="dark"] .item-icon.ui-violet { background: #37305c; }
html[data-theme="dark"] .item-icon.ui-gray { background: #3d3d52; }
html[data-theme="dark"] .item-icon.ui-orange { background: #4d4033; }
html[data-theme="dark"] .item-icon.ui-teal { background: #254944; }
html[data-theme="dark"] .item-icon.ui-red { background: #502a38; }
html[data-theme="dark"] .item-icon.ui-blue { background: #28425c; }
html[data-theme="dark"] .item-icon.ui-green { background: #245140; }
.item-card .titles { flex: 1; min-width: 0; }
.item-card .title {
  font-weight: 600; font-size: 14px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.item-card .subtitle {
  color: var(--text-weak); font-size: 12px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.item-card .badges { display: flex; gap: 4px; align-items: center; flex-shrink: 0; color: var(--text-hint); }
.badge-shared {
  font-size: 11px; font-weight: 600;
  color: var(--interaction-norm); background: var(--interaction-weak);
  padding: 1px 6px; border-radius: 4px;
}

.detail-pane { flex: 1; overflow-y: auto; min-width: 0; position: relative; background: var(--background-norm); }
.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100%; color: var(--text-hint); gap: 14px;
  position: absolute; inset: 0;
}
.detail-content { padding: 16px 20px 60px; max-width: 820px; }
.detail-header {
  display: flex; align-items: flex-start; gap: 14px;
  margin-bottom: 18px;
}
.detail-header .item-icon { width: 44px; height: 44px; min-width: 44px; }
.detail-header .item-icon svg { width: 24px; height: 24px; }
.detail-header h2 { font-size: 20px; font-weight: 700; line-height: 24px; word-break: break-word; margin-bottom: 2px; }
.detail-meta { display: flex; align-items: center; gap: 6px; color: var(--text-weak); font-size: 12px; }
.vault-tag { display: inline-flex; align-items: center; gap: 4px; color: #8849ff; font-weight: 600; }
.vault-tag svg { width: 12px; height: 12px; }
.detail-header .spacer { flex: 1; }
.detail-header .actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
.crumb { display: inline-flex; align-items: center; gap: 4px; color: var(--text-weak); }
.crumb-sep { color: var(--text-hint); }
.detail-location {
  display: inline-flex; align-items: center; gap: 5px;
  color: var(--text-weak);
  font-size: 12px;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
}
.detail-crumb { color: var(--text-weak); min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.detail-crumb:last-child { flex-shrink: 0; }
.detail-crumb-sep { color: var(--text-hint); flex-shrink: 0; }
.detail-crumb-icon {
  display: inline-flex; width: 13px; height: 13px;
  color: var(--folder-icon);
  flex-shrink: 0;
  vertical-align: -2px;
}
.detail-crumb-icon svg { width: 13px; height: 13px; display: block; }

/* field cluster: stacked white rows with dividers, like pass-fieldset-cluster */
.field-cluster { border-radius: var(--radius-md); margin-bottom: 12px; overflow: hidden; }
.field-row {
  display: flex; align-items: stretch;
  background: var(--background-weak);
  border-bottom: 1px solid var(--border-weak);
}
.field-cluster .field-row:last-child { border-bottom: none; }
.field-cluster .field-row:first-child { border-radius: var(--radius-md) var(--radius-md) 0 0; }
.field-cluster .field-row:last-child { border-radius: 0 0 var(--radius-md) var(--radius-md); }
.field-cluster .field-row:only-child { border-radius: var(--radius-md); }
.field-box { display: flex; flex: 1; min-width: 0; padding: 12px 16px; gap: 0; align-items: flex-start; }
.field-glyph {
  display: flex; justify-content: center; align-items: flex-start;
  padding-right: 14px; margin-top: 3px;
  color: var(--fieldset-icon); flex-shrink: 0;
}
.field-glyph svg { width: 16px; height: 16px; }
.field-main { flex: 1; min-width: 0; }
.field-label { color: var(--text-weak); font-size: 12px; margin-bottom: 1px; }
.field-value {
  font-size: 14px; color: var(--text-norm);
  word-break: break-word;
  display: flex; align-items: center; gap: 8px;
  cursor: pointer;
}
.field-value.no-copy { cursor: default; }
.field-value.plain { font-family: inherit; }
.field-value.mono, .field-value.mono .field-display {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 13px;
}
.field-value.masked-value .field-display { letter-spacing: .18em; }
.field-note { white-space: pre-wrap; font-family: inherit; display: block; cursor: auto; }
.field-actions { display: flex; align-items: center; padding: 2px 4px 2px 8px; gap: 2px; flex-shrink: 0; }
.field-btn {
  background: transparent; color: var(--text-weak);
  border: none; cursor: pointer; padding: 7px;
  border-radius: var(--radius-sm);
  display: inline-flex; align-items: center; gap: 4px;
  font: inherit; font-size: 12px;
  transition: background .15s, color .15s;
}
.field-btn:hover { background: var(--hover-strong); color: var(--text-norm); }
.field-btn.copied { color: var(--success); }
.field-btn svg { width: 16px; height: 16px; display: block; }
.masked-value { letter-spacing: .2em; }

/* meta card (last modified / created) */
.meta-card {
  display: flex; flex-direction: column; gap: 12px;
  border: 1px solid var(--border-weak);
  border-radius: var(--radius-lg);
  padding: 12px 16px;
  margin-bottom: 12px;
}
.meta-row { display: flex; align-items: center; gap: 14px; font-size: 12px; }
.meta-row svg { width: 16px; height: 16px; color: var(--text-weak); flex-shrink: 0; }
.meta-row .meta-titles { display: flex; flex-direction: column; min-width: 0; }
.meta-row .meta-title { color: var(--text-norm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta-row .meta-sub { color: var(--text-weak); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.detail-section-title {
  font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
  color: var(--text-hint);
  padding: 14px 0 8px;
}
.note-block {
  background: var(--background-weak);
  border-bottom: 1px solid var(--border-weak);
  padding: 12px 16px;
  white-space: pre-wrap; word-break: break-word;
  line-height: 1.6; font-size: 14px;
}
.section-block { margin-bottom: 12px; }
.section-block h4 { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
.link { color: var(--interaction-norm); text-decoration: none; }
.link:hover { text-decoration: underline; }
.url-list a { display: block; margin-bottom: 4px; word-break: break-all; }
.passkey-row {
  background: var(--background-weak); border: 1px solid var(--border-weak);
  border-radius: var(--radius-md); padding: 12px 14px; margin-bottom: 8px;
}
.passkey-row .pk-domain { font-weight: 600; display: flex; align-items: center; gap: 8px; }
.passkey-row .pk-domain svg { width: 16px; height: 16px; color: var(--interaction-norm); }
.passkey-row .pk-user { color: var(--text-weak); font-size: 12px; margin-top: 2px; }
.attach-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  background: var(--background-weak);
  border-bottom: 1px solid var(--border-weak);
}
.attach-row:first-child { border-radius: var(--radius-md) var(--radius-md) 0 0; }
.attach-row:last-child { border-bottom: none; border-radius: 0 0 var(--radius-md) var(--radius-md); }
.attach-row:only-child { border-radius: var(--radius-md); }
.attach-icon { display: inline-flex; color: var(--fieldset-icon); }
.attach-icon svg { width: 20px; height: 20px; }
.attach-name { flex: 1; word-break: break-all; font-weight: 600; }
.attach-size { color: var(--text-weak); font-size: 12px; white-space: nowrap; }

.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--text-norm); border: none;
  color: var(--background-norm); border-radius: var(--radius-sm);
  padding: 10px 18px; font-size: 14px;
  box-shadow: 0 8px 30px var(--shadow-color);
  z-index: 200; transition: opacity .25s;
}

@media (max-width: 900px) {
  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 50; transform: translateX(-100%); transition: transform .2s; }
  .sidebar.open { transform: translateX(0); box-shadow: 0 0 40px var(--shadow-color); }
  .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 45; }
  .sidebar-overlay.open { display: block; }
  .list-col { width: 100%; min-width: 0; border-right: none; }
  .body-row.has-detail .list-col { display: none; }
  .body-row.has-detail .detail-pane { position: absolute; inset: 0; z-index: 40; }
  .detail-content { padding: 12px 14px 60px; }
  #menu-toggle { display: inline-flex; }
}

/* Narrow desktop: hide the sidebar behind the hamburger, list fills rest */
@media (min-width: 901px) and (max-width: 1160px) {
  #sidebar:not(.force-show) { display: none !important; }
  #menu-toggle { display: inline-flex; }
}

@media (min-width: 1161px) {
  #sidebar.force-show { display: flex; }
}

/* Detail header stacks gracefully on narrow panes */
@media (max-width: 700px) {
  .detail-meta { flex-wrap: wrap; row-gap: 4px; }
  .detail-header { flex-wrap: wrap; }
  .detail-header h2 { font-size: 18px; }
}

/* Short viewports: compress header heights slightly */
@media (max-height: 600px) {
  .brand { height: 48px; }
  .item-list-header { min-height: 44px; }
}
</style>

function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}
function formatDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
}
function formatDateTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleString(undefined, { year: "numeric", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}
function formatSize(bytes) {
  if (bytes == null) return "";
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
  return (bytes / 1024 / 1024).toFixed(2) + " MB";
}
let toastTimer = null;
function toast(msg) {
  let el = $("#toast-el");
  if (!el) {
    el = document.createElement("div");
    el.id = "toast-el";
    el.className = "toast";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = "1";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.opacity = "0"; }, 1600);
}
async function copyText(text, btn) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
  }
  toast("Copied to clipboard");
  if (btn) {
    btn.classList.add("copied");
    const old = btn.innerHTML;
    btn.innerHTML = iconSvg("ic-checkmark") || "&#10003;";
    setTimeout(() => { btn.classList.remove("copied"); btn.innerHTML = old; }, 1200);
  }
}
function iconSvg(id, cls) {
  return `<svg viewBox="0 0 16 16"${cls ? ` class="${cls}"` : ""} aria-hidden="true"><use href="#${id}"></use></svg>`;
}
function hexToRgb(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || "");
  if (!m) return [136, 73, 255];
  const n = parseInt(m[1], 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function domainOf(url) {
  try {
    const u = new URL(url.includes("://") ? url : "https://" + url);
    const parts = u.hostname.split(".");
    if (parts.length >= 2) return parts.slice(-2).join(".");
    return u.hostname;
  } catch (e) {
    const clean = url.replace(/^https?:\/\//, "").split("/")[0];
    const parts = clean.split(".");
    return parts.length >= 2 ? parts.slice(-2).join(".") : clean;
  }
}

/* ---------------- decryption ---------------- */
async function deriveKeyArgon2(password, saltHex, kdf) {
  // Pure-JS Argon2id (embedded above as an IIFE). Runs synchronously and
  // blocks the UI thread for roughly a second at 64 MiB / t=2 / p=4.
  return __passArchiveKdf.derive(password, saltHex, kdf);
}
async function decryptArchive(password) {
  const envelope = JSON.parse(__PAYLOAD_JSON);
  const key = await deriveKeyArgon2(password, envelope.salt, envelope.kdf);
  const blob = b64ToBytes(envelope.blob);
  const nonce = blob.slice(0, 12);
  const ciphertext = blob.slice(12);
  const cryptoKey = await crypto.subtle.importKey("raw", key, { name: "AES-GCM" }, false, ["decrypt"]);
  const aad = new TextEncoder().encode("proton-pass-archive-v1");
  const plain = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: nonce, additionalData: aad },
    cryptoKey,
    ciphertext
  );
  return JSON.parse(new TextDecoder().decode(plain));
}

/* ---------------- app state ---------------- */
let DATA = null;
let state = {
  filter: "all",
  typeFilter: null,
  vaultFilter: null,
  folderFilter: null,
  expandedFolders: {},
  search: "",
  selectedItem: null,
};
const VAULT_DOT_COLORS = ["#8849ff", "#00afe6", "#e65200", "#007b58", "#cc2d4f", "#5817d1", "#f0a500"];
const TYPE_META = {
  login:       { label: "Logins",       icon: "ic-user",            ui: "ui-violet",  singular: "Login" },
  note:        { label: "Notes",        icon: "ic-file-lines",      ui: "ui-orange",  singular: "Note" },
  alias:       { label: "Aliases",      icon: "ic-alias",           ui: "ui-teal",    singular: "Alias" },
  credit_card: { label: "Credit cards", icon: "ic-pass-credit-card",ui: "ui-gray",    singular: "Credit card" },
  identity:    { label: "Identities",   icon: "ic-card-identity",   ui: "ui-blue",    singular: "Identity" },
  ssh_key:     { label: "SSH keys",     icon: "ic-filing-cabinet",  ui: "ui-gray",    singular: "SSH key" },
  wifi:        { label: "Wi\u2011Fi",   icon: "ic-shield-2",        ui: "ui-teal",    singular: "Wi-Fi" },
  custom:      { label: "Custom items", icon: "ic-wrench",          ui: "ui-gray",    singular: "Custom item" },
};
function vaultColor(vault, idx) {
  if (vault && vault.color) return vault.color;
  let h = 0;
  const s = (vault && vault.id ? vault.id : "v") + (idx || 0);
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return VAULT_DOT_COLORS[h % VAULT_DOT_COLORS.length];
}
function vaultById(id) { return DATA.vaults.find((v) => v.id === id); }
function vaultOfItem(item) { return vaultById(item.vault_id); }
function isSharedItem(item) { return item.vault_id === "shared-with-me"; }
function folderById(id) { return (DATA.folders || []).find((f) => f.id === id); }
function foldersOfShare(shareId) { return (DATA.folders || []).filter((f) => f.share_id === shareId); }
function childFolders(shareId, parentId) {
  return foldersOfShare(shareId).filter((f) => (f.parent_folder_id || null) === parentId);
}
function folderPathIds(id) {
  const path = [];
  let cur = folderById(id);
  const seen = new Set();
  while (cur && !seen.has(cur.id)) {
    seen.add(cur.id);
    path.unshift(cur);
    cur = cur.parent_folder_id ? folderById(cur.parent_folder_id) : null;
  }
  return path;
}
function descendantsOfFolder(shareId, folderId, includeSelf) {
  const out = includeSelf ? [folderId] : [];
  const stack = [folderId];
  const guard = new Set(stack);
  while (stack.length) {
    const cur = stack.pop();
    for (const f of foldersOfShare(shareId)) {
      if (f.parent_folder_id === cur && !guard.has(f.id)) {
        guard.add(f.id);
        out.push(f.id);
        stack.push(f.id);
      }
    }
  }
  return out;
}
function folderLabelOf(item) {
  if (!item.folder_id) return "";
  const path = folderPathIds(item.folder_id);
  return path.map((f) => f.name).join(" › ");
}
function itemSubtitle(item) {
  switch (item.item_type) {
    case "login": return item.content.kind === "login" ? (item.content.username || item.content.email) : "";
    case "alias": return item.alias_email || item.title;
    case "credit_card": return item.content.kind === "credit_card" ? item.content.number.replace(/\d(?=\d{4})/g, "\u2022") : "";
    case "wifi": return item.content.kind === "wifi" ? item.content.ssid : "";
    case "ssh_key": return "SSH key";
    case "identity": return item.content.kind === "identity" ? (item.content.email || item.content.full_name) : "";
    default: {
      const s = (item.note || "").split("\n")[0];
      return s.length > 60 ? s.slice(0, 60) + "\u2026" : s;
    }
  }
}

/* ---------------- unlocking ---------------- */
function showLock() {
  $("#lock-screen").classList.remove("hidden");
  const btn = $("#lock-button");
  const input = $("#lock-password");
  const attempt = async () => {
    const pw = input.value;
    if (!pw) return;
    btn.disabled = true;
    btn.textContent = "Deriving key\u2026";
    $("#lock-error").classList.add("hidden");
    try {
      DATA = await decryptArchive(pw);
      startApp();
    } catch (e) {
      $("#lock-error").textContent = "Wrong password or corrupted archive.";
      $("#lock-error").classList.remove("hidden");
      btn.disabled = false;
      btn.textContent = "Unlock archive";
      input.focus();
      input.select();
    }
  };
  btn.addEventListener("click", attempt);
  input.addEventListener("keydown", (ev) => { if (ev.key === "Enter") attempt(); });
  input.focus();
}

function startApp() {
  $("#lock-screen").classList.add("hidden");
  $("#app").classList.remove("hidden");
  buildSidebar();
  renderList();
}

/* ---------------- sidebar ---------------- */
function buildTypePills() {
  const counts = {};
  for (const item of DATA.items) counts[item.item_type] = (counts[item.item_type] || 0) + 1;
  const el = $("#type-pills");
  el.innerHTML = "";
  Object.entries(TYPE_META).forEach(([type, meta]) => {
    if (!counts[type]) return;
    const btn = document.createElement("button");
    btn.type = "button";
    btn.dataset.type = type;
    btn.innerHTML = `${iconSvg(meta.icon)}${meta.label}`;
    btn.title = `${meta.label} (${counts[type]})`;
    btn.addEventListener("click", () => {
      state.typeFilter = state.typeFilter === type ? null : type;
      state.filter = "types";
      state.vaultFilter = null;
      state.folderFilter = null;
      updateSidebarActive();
      renderList();
    });
    el.appendChild(btn);
  });
}
function syncSearchContext() {
  const input = $("#search");
  if (!input) return;
  let scope = null;
  if (state.filter === "vault" && state.vaultFilter) scope = vaultById(state.vaultFilter)?.name;
  else if (state.filter === "folder" && state.folderFilter) {
    const path = folderPathIds(state.folderFilter);
    if (path.length) scope = path[path.length - 1].name;
  }
  input.placeholder = scope ? `Search in ${scope}\u2026` : "Search all items";
  $("#top-search").classList.toggle("has-text", !!input.value);
}

function buildSidebar() {
  // type-filter pills (above the item list, like the web app)
  buildTypePills();

  // vault + folder tree
  buildSidebarVaults();

  document.querySelectorAll(".filter[data-filter]").forEach((btn) => {
    btn.addEventListener("click", () => {
      state.filter = btn.dataset.filter;
      state.typeFilter = null;
      state.vaultFilter = null;
      state.folderFilter = null;
      updateSidebarActive();
      renderList();
    });
  });

  $("#count-all").textContent = DATA.items.length + " items";
  $("#vaults-title").textContent = (DATA.folders || []).length ? "Vaults \u0026 folders" : "Vaults";
  const folderCount = (DATA.folders || []).length;
  $("#export-info").innerHTML =
    `Exported ${formatDate(META.exported_at)}<br>${DATA.items.length} items \u00b7 ${DATA.vaults.length} vaults`
    + (folderCount ? ` \u00b7 ${folderCount} folders` : "")
    + (META.encrypted ? "<br>\ud83d\udd12 encrypted archive" : "<br>unencrypted archive");
  updateSidebarActive();
}
function buildSidebarVaults() {
  const vaultEl = $("#vault-list");
  vaultEl.innerHTML = "";
  // With no folders anywhere there are no chevrons to align against, so skip
  // the invisible chevron spacer and let the chip sit flush left.
  const anyFolders = (DATA.folders || []).length > 0;
  DATA.vaults.forEach((vault, idx) => {
    const rootFolders = childFolders(vault.share_id, null);
    const expandable = rootFolders.length > 0;
    const vaultKey = "v:" + vault.id;
    const vaultOpen = expandable && !!state.expandedFolders[vaultKey];

    const row = document.createElement("button");
    row.className = "filter vault has-chip";
    row.dataset.vault = vault.id;
    const vcount = DATA.items.filter((i) => i.vault_id === vault.id).length;
    row.innerHTML =
      (expandable
        ? `<span class="folder-chevron ${vaultOpen ? "expanded" : "collapsed"}" data-chev-vault="${escapeHtml(vault.id)}">${iconSvg(vaultOpen ? "ic-chevron-down-filled" : "ic-chevron-right-filled")}</span>`
        : anyFolders
          ? `<span class="folder-chevron" style="visibility:hidden">${iconSvg("ic-chevron-right-filled")}</span>`
          : "")
      + `<span class="row-chip vault" style="--chip:${hexToRgb(vaultColor(vault, idx)).join(' ')}">${iconSvg("ic-pass-home")}</span>`
      + `<span class="nav-labels"><span class="nav-name">${escapeHtml(vault.name)}</span><span class="nav-sub">${vcount} item${vcount === 1 ? "" : "s"}</span></span>`;
    row.title = escapeHtml(vault.description || vault.name);
    row.addEventListener("click", () => {
      state.folderFilter = null;
      state.vaultFilter = state.vaultFilter === vault.id ? null : vault.id;
      state.filter = "vault";
      state.typeFilter = null;
      updateSidebarActive();
      renderList();
    });
    vaultEl.appendChild(row);

    if (expandable) {
      row.querySelector(".folder-chevron").addEventListener("click", (ev) => {
        ev.stopPropagation();

        state.expandedFolders[vaultKey] = !state.expandedFolders[vaultKey];
        renderVaultTree();
      });

      const children = document.createElement("div");
      children.className = "folder-rows";
      children.style.display = vaultOpen ? "block" : "none";
      vaultEl.appendChild(children);
      if (vaultOpen) renderFolderNodes(children, vault, null, 0);
    }
  });
}

function renderVaultTree() {
  buildSidebarVaults();
  updateSidebarActive();
}

function selectFolder(folder) {
  state.folderFilter = state.folderFilter === folder.id ? null : folder.id;
  state.filter = "folder";
  state.vaultFilter = null;
  state.typeFilter = null;
  if (state.folderFilter) {
    // Expand ancestors so the selection is visible in the tree.
    let cur = folder.parent_folder_id ? folderById(folder.parent_folder_id) : null;
    while (cur) {
      state.expandedFolders[cur.id] = true;
      cur = cur.parent_folder_id ? folderById(cur.parent_folder_id) : null;
    }
  }
  renderVaultTree();
  renderList();
}

function renderFolderNodes(mount, vault, parentId, depth) {
  childFolders(vault.share_id, parentId).forEach((folder) => {
    const kidsHere = childFolders(vault.share_id, folder.id);
    const expandable = kidsHere.length > 0;
    const open = expandable && !!state.expandedFolders[folder.id];

    const btn = document.createElement("button");
    btn.className = "filter folder";
    btn.dataset.folder = folder.id;
    btn.style.paddingLeft = 22 + depth * 12 + "px";
    btn.innerHTML =
      (expandable
        ? `<span class="folder-chevron ${open ? "expanded" : "collapsed"}">${iconSvg(open ? "ic-chevron-down-filled" : "ic-chevron-right-filled")}</span>`
        : `<span class="folder-chevron" style="visibility:hidden">${iconSvg("ic-chevron-right-filled")}</span>`)
      + `<span class="folder-icon">${iconSvg(open ? "ic-folder-open" : "ic-folder-closed")}</span>`
      + escapeHtml(folder.name)
      + `<span class="count">${itemsInFolderBranch(vault.share_id, folder.id).length}</span>`;
    btn.addEventListener("click", () => selectFolder(folder));
    mount.appendChild(btn);

    if (expandable) {
      btn.querySelector(".folder-chevron").addEventListener("click", (ev) => {
        ev.stopPropagation();
        state.expandedFolders[folder.id] = !state.expandedFolders[folder.id];
        renderVaultTree();
      });

      const children = document.createElement("div");
      children.className = "folder-children";
      mount.appendChild(children);
      if (open) renderFolderNodes(children, vault, folder.id, depth + 1);
    }
  });
}

function itemsInFolderBranch(shareId, folderId) {
  const ids = new Set(descendantsOfFolder(shareId, folderId, true));
  return DATA.items.filter((i) => i.share_id === shareId && i.folder_id && ids.has(i.folder_id));
}

function updateSidebarActive() {
  document.querySelectorAll(".filter").forEach((el) => {
    const isActive =
      (el.dataset.filter === state.filter && !el.dataset.type && !el.dataset.vault && !el.dataset.folder) ||
      (el.dataset.vault && state.filter === "vault" && el.dataset.vault === state.vaultFilter) ||
      (el.dataset.folder && state.filter === "folder" && el.dataset.folder === state.folderFilter);
    el.classList.toggle("active", !!isActive);
  });
  document.querySelectorAll("#type-pills button").forEach((el) => {
    el.classList.toggle("active", state.filter === "types" && el.dataset.type === state.typeFilter);
  });
  syncSearchContext();
}

/* ---------------- filtering ---------------- */
function filteredItems() {
  let items = DATA.items.slice();
  if (state.filter === "types" && state.typeFilter) items = items.filter((i) => i.item_type === state.typeFilter);
  if (state.filter === "vault" && state.vaultFilter) items = items.filter((i) => i.vault_id === state.vaultFilter);
  if (state.filter === "folder" && state.folderFilter) {
    const folder = folderById(state.folderFilter);
    if (folder) {
      const ids = new Set(descendantsOfFolder(folder.share_id, folder.id, true));
      items = items.filter((i) => i.folder_id && ids.has(i.folder_id));
    } else {
      items = [];
    }
  }
  if (state.search) {
    const q = state.search.toLowerCase();
    items = items.filter((i) => {
      const hay = [
        i.title, i.note,
        i.content.kind === "login" ? [i.content.username, i.content.email, (i.content.urls||[]).join(" ")].join(" ") : "",
        i.content.kind === "credit_card" ? i.content.cardholder_name : "",
        i.extra_fields.map((f) => f.name + " " + fieldValueText(f)).join(" "),
        (i.attachments||[]).map((a) => a.name).join(" "),
        i.folder_id ? folderLabelOf(i) : "",
      ].join(" ").toLowerCase();
      return hay.includes(q);
    });
  }
  return items;
}
function fieldValueText(f) {
  if (f.content.type === "totp") return "";
  return f.content.value !== undefined ? f.content.value : "";
}

/* ---------------- list rendering ---------------- */
function renderList() {
  const items = filteredItems();
  const listEl = $("#item-list");
  listEl.innerHTML = "";
  $("#list-count").textContent = items.length + (items.length === 1 ? " item" : " items");
  let title = "All items";
  let crumbHtml = "";
  if (state.filter === "vault" && state.vaultFilter) {
    title = vaultById(state.vaultFilter)?.name || "Vault";
  } else if (state.filter === "types" && state.typeFilter) {
    title = TYPE_META[state.typeFilter]?.label || "Items";
  } else if (state.filter === "folder" && state.folderFilter) {
    const path = folderPathIds(state.folderFilter);
    title = path.map((f) => escapeHtml(f.name)).join('<span class="crumb-sep"> › </span>');
    crumbHtml = title;
  }
  const titleEl = $("#list-title");
  titleEl.innerHTML = crumbHtml ? `<span class="crumbs">${crumbHtml}</span>` : escapeHtml(title);
  titleEl.title = crumbHtml ? "" : title;
  syncSearchContext();

  items.forEach((item) => {
    const meta = TYPE_META[item.item_type] || TYPE_META.custom;
    const card = document.createElement("div");
    card.className = "item-card" + (state.selectedItem === item.id ? " active" : "");
    card.innerHTML = `
      <div class="item-icon ${meta.ui}">${iconSvg(meta.icon)}</div>
      <div class="titles">
        <div class="title">${escapeHtml(item.title || meta.singular)}</div>
        <div class="subtitle">${escapeHtml(itemSubtitle(item) || "")}</div>
      </div>
      <div class="badges">
        ${isSharedItem(item) ? '<span class="badge badge-shared">shared</span>' : ""}
        ${(item.attachments||[]).length ? `<span class="att-count">${iconSvg("ic-paper-clip")}</span>` : ""}
      </div>`;
    card.addEventListener("click", () => selectItem(item.id));
    listEl.appendChild(card);
  });

  if (!items.length) {
    listEl.innerHTML = '<div style="padding:30px;text-align:center;color:var(--text-hint)">No items found</div>';
  }
}

function selectItem(id) {
  state.selectedItem = id;
  renderList();
  const item = DATA.items.find((i) => i.id === id);
  if (item) renderDetail(item);
  const bodyRow = document.querySelector(".body-row");
  if (window.innerWidth <= 900 && bodyRow) bodyRow.classList.add("has-detail");
}

/* ---------------- detail rendering ---------------- */
function fieldRow(label, valueHtml, opts) {
  opts = opts || {};
  const copyable = opts.copy !== false && opts.rawValue != null && opts.rawValue !== "";
  return `
  <div class="field-row">
    <div class="field-box">
      ${opts.glyph === false ? "" : `<span class="field-glyph">${iconSvg(opts.glyphIcon || "ic-key")}</span>`}
      <div class="field-main">
        <div class="field-label">${escapeHtml(label)}</div>
        <div class="field-value${opts.plain ? " plain" : ""}${opts.mono ? " mono" : ""}${opts.masked ? " masked-value" : ""}" id="${opts.domId || ""}">
          <span class="field-display">${valueHtml}</span>
        </div>
      </div>
    </div>
    <div class="field-actions">
      ${opts.extraButtons || ""}
      ${copyable ? `<button class="field-btn copy-btn" title="Copy" data-copy="${escapeHtml(opts.rawValue)}">${iconSvg("ic-meet-copy")}</button>` : ""}
      ${opts.reveal ? `<button class="field-btn reveal-btn" title="Show/Hide">${iconSvg("ic-eye")}</button>` : ""}
    </div>
  </div>`;
}
function metaCard(item) {
  return `<div class="meta-card">
    <div class="meta-row">${iconSvg("ic-magic-wand")}<div class="meta-titles"><span class="meta-title">Last modified</span><span class="meta-sub">${formatDateTime(item.modify_time)}</span></div></div>
    <div class="meta-row">${iconSvg("ic-bolt")}<div class="meta-titles"><span class="meta-title">Created</span><span class="meta-sub">${formatDateTime(item.create_time)}</span></div></div>
  </div>`;
}
function renderDetail(item) {
  const meta = TYPE_META[item.item_type] || TYPE_META.custom;
  const vault = vaultOfItem(item);
  const content = $("#detail-content");
  $("#empty-state").classList.add("hidden");
  content.classList.remove("hidden");

  const folderCrumb = item.folder_id ? folderPathIds(item.folder_id) : [];
  const folderLoc = folderCrumb.length
    ? `<span class="detail-location" title="${escapeHtml(folderCrumb.map((f) => f.name).join(" › "))}">${folderCrumb.map((f) => `<span class="detail-crumb">${escapeHtml(f.name)}</span>`).join('<span class="detail-crumb-sep">›</span>')}</span>`
    : "";
  let html = `
    <div class="detail-header">
      <div class="item-icon ${meta.ui}">${iconSvg(meta.icon)}</div>
      <div style="flex:1;min-width:0">
        <h2>${escapeHtml(item.title || meta.singular)}</h2>
        <div class="detail-meta">
          <span class="vault-tag">${iconSvg("ic-pass-home")}${escapeHtml(vault ? vault.name : "Unknown vault")}</span>
          ${folderLoc ? folderLoc + "<span>·</span>" : ""}
          <span>${escapeHtml(meta.singular)}</span>
          ${isSharedItem(item) ? "<span>· shared with you</span>" : ""}
        </div>
      </div>
      <div class="spacer"></div>
    </div>`;

  const clusters = [];
  const pushRow = (rowHtml, kind) => {
    if (!clusters.length || clusters[clusters.length-1].kind !== kind) clusters.push({ kind, rows: [] });
    clusters[clusters.length-1].rows.push(rowHtml);
  };

  if (item.note) {
    pushRow(`<div class="field-row"><div class="field-box"><span class="field-glyph">${iconSvg("ic-file-lines")}</span><div class="field-main"><div class="field-label">Note</div><div class="field-value plain no-copy"><span class="field-note">${escapeHtml(item.note)}</span></div></div></div></div>`, "fields");
  }

  const c = item.content;
  if (item.item_type === "alias") {
    const addr = item.alias_email || item.title;
    pushRow(fieldRow("Alias address", escapeHtml(addr), { rawValue: addr, glyphIcon: "ic-alias" }), "fields");
  } else if (c.kind === "login") {
    if (c.email) pushRow(fieldRow("Email", escapeHtml(c.email), { rawValue: c.email, domId: "v-email", glyphIcon: "ic-envelope" }), "fields");
    if (c.username) pushRow(fieldRow("Username", escapeHtml(c.username), { rawValue: c.username, domId: "v-username", glyphIcon: "ic-user" }), "fields");
    if (c.password) pushRow(fieldRow("Password", "\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022", { rawValue: c.password, reveal: true, masked: true, mono: true, glyphIcon: "ic-key" }), "fields");
    if ((c.urls || []).length) {
      pushRow(`<div class="field-row"><div class="field-box"><span class="field-glyph">${iconSvg("ic-globe")}</span><div class="field-main"><div class="field-label">Website</div><div class="field-value plain no-copy url-list">${
        c.urls.map((u) => `<a class="link" href="${escapeHtml(u)}" target="_blank" rel="noopener noreferrer">${escapeHtml(u)}</a>`).join("")
      }</div></div></div></div>`, "fields");
    }
    if (c.totp_uri) pushRow(totpRowHtml(c.totp_uri), "fields");
    for (const pk of c.passkeys || []) {
      pushRow(`<div class="field-row"><div class="field-box"><span class="field-glyph">${iconSvg("ic-key")}</span><div class="field-main"><div class="field-value plain no-copy"><div class="passkey-row" style="border:none;background:transparent;padding:0"><div class="pk-domain">${iconSvg("ic-key")}${escapeHtml(pk.rp_name || pk.domain)}</div><div class="pk-user">${escapeHtml(pk.user_name || pk.user_display_name)}</div></div></div></div></div></div>`, "fields");
    }
  } else if (c.kind === "credit_card") {
    if (c.cardholder_name) pushRow(fieldRow("Cardholder", escapeHtml(c.cardholder_name), { rawValue: c.cardholder_name, plain: true, glyphIcon: "ic-user" }), "fields");
    if (c.number) pushRow(fieldRow("Card number", escapeHtml(maskCard(c.number)), { rawValue: c.number, reveal: true, masked: true, mono: true, glyphIcon: "ic-pass-credit-card" }), "fields");
    if (c.expiration_date) pushRow(fieldRow("Expiration", escapeHtml(c.expiration_date), { rawValue: c.expiration_date, glyphIcon: "ic-clock" }), "fields");
    if (c.verification_number) pushRow(fieldRow("CVV", "\u2022\u2022\u2022", { rawValue: c.verification_number, reveal: true, masked: true, mono: true, glyphIcon: "ic-shield" }), "fields");
    if (c.pin) pushRow(fieldRow("PIN", "\u2022\u2022\u2022\u2022", { rawValue: c.pin, reveal: true, masked: true, mono: true, glyphIcon: "ic-key" }), "fields");
  } else if (c.kind === "identity") {
    const idRows = [
      ["Full name", c.full_name, "ic-user"], ["Email", c.email, "ic-envelope"], ["Phone", c.phone_number, "ic-clock"],
      ["Organization", c.organization, "ic-pass-work"], ["Street address", c.street_address, "ic-pass-home"],
      ["City", c.city, "ic-pass-home"], ["State", c.state_or_province, "ic-pass-home"], ["Country", c.country_or_region, "ic-globe"],
      ["ZIP", c.zip_or_postal_code, "ic-pass-home"], ["Social security", c.social_security_number, "ic-card-identity"],
      ["Passport", c.passport_number, "ic-card-identity"], ["License", c.license_number, "ic-card-identity"],
      ["Birthdate", c.birthdate, "ic-clock"], ["Gender", c.gender, "ic-user"], ["Company", c.company, "ic-pass-work"],
      ["Job title", c.job_title, "ic-pass-work"], ["Website", c.website, "ic-globe"],
    ];
    for (const [label, val, g] of idRows) {
      if (val) pushRow(fieldRow(label, escapeHtml(val), { rawValue: val, plain: true, glyphIcon: g }), "fields");
    }
    const sections = [...(c.extra_sections || [])];
    for (const sec of sections) {
      pushRow(...sectionBlock(sec), "sections");
    }
  } else if (c.kind === "ssh_key") {
    if (c.private_key) pushRow(fieldRow("Private key", "PRIVATE KEY", { rawValue: c.private_key, reveal: true, masked: true, mono: true, glyphIcon: "ic-key" }), "fields");
    if (c.public_key) pushRow(fieldRow("Public key", "PUBLIC KEY", { rawValue: c.public_key, reveal: true, masked: true, mono: true, glyphIcon: "ic-key-history" }), "fields");
    for (const sec of c.sections || []) {
      pushRow(...sectionBlock(sec), "sections");
    }
  } else if (c.kind === "wifi") {
    if (c.ssid) pushRow(fieldRow("SSID", escapeHtml(c.ssid), { rawValue: c.ssid, glyphIcon: "ic-globe" }), "fields");
    if (c.password) pushRow(fieldRow("Password", "\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022", { rawValue: c.password, reveal: true, masked: true, mono: true, glyphIcon: "ic-key" }), "fields");
    if (c.security && c.security !== "None") pushRow(fieldRow("Security", escapeHtml(c.security), { copy: false, glyphIcon: "ic-shield" }), "fields");
    for (const sec of c.sections || []) {
      pushRow(...sectionBlock(sec), "sections");
    }
  } else if (c.kind === "custom") {
    for (const sec of c.sections || []) {
      pushRow(...sectionBlock(sec), "sections");
    }
  }

  for (const f of item.extra_fields || []) {
    pushRow(extraFieldRow(f), "fields");
  }

  for (const cluster of clusters) {
    if (cluster.kind === "sections") {
      html += cluster.rows.join("");
    } else {
      html += `<div class="field-cluster">${cluster.rows.join("")}</div>`;
    }
  }

  html += metaCard(item);

  if ((item.attachments || []).length) {
    const atts = item.attachments.map((a) => {
      if (!a.data_base64) {
        return `<div class="attach-row"><span class="attach-icon">${iconSvg("ic-paper-clip")}</span><span class="attach-name">${escapeHtml(a.name)}</span>
          <span class="attach-size">${formatSize(a.size)}</span>
          <span class="attach-size" title="Re-export with --include-attachments to embed this file">not embedded</span></div>`;
      }
      return `<div class="attach-row"><span class="attach-icon">${attachmentIcon(a.mime_type)}</span><span class="attach-name">${escapeHtml(a.name)}</span>
        <span class="attach-size">${formatSize(a.size)}</span>
        <button class="field-btn att-download" data-att-id="${escapeHtml(a.id)}">${iconSvg("ic-arrow-rotate-right")} Save</button></div>`;
    }).join("");
    html += `<div class="detail-section-title">Attachments (${item.attachments.length})</div><div class="field-cluster" style="background:transparent">${atts}</div>`;
  }

  content.innerHTML = html;

  // wire events
  content.querySelectorAll(".copy-btn").forEach((btn) => {
    btn.addEventListener("click", () => copyText(btn.dataset.copy || "", btn));
  });
  content.querySelectorAll(".reveal-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      const row = btn.closest(".field-row");
      const valueDiv = row.querySelector(".field-value");
      const copyBtn = row.querySelector(".copy-btn");
      const real = copyBtn ? copyBtn.dataset.copy : "";
      const masked = valueDiv.classList.contains("masked-value");
      if (masked) {
        valueDiv.classList.remove("masked-value");
        valueDiv.querySelector(".field-display").textContent = real;
        btn.innerHTML = iconSvg("ic-eye-slash");
      } else {
        valueDiv.classList.add("masked-value");
        valueDiv.querySelector(".field-display").textContent = "\u2022".repeat(Math.min(Math.max(real.length, 8), 20));
        btn.innerHTML = iconSvg("ic-eye");
      }
    });
  });
  // click on value copies (like pass-value-control)
  content.querySelectorAll(".field-value").forEach((v) => {
    if (v.classList.contains("no-copy")) return;
    v.addEventListener("click", () => {
      const row = v.closest(".field-row");
      const copyBtn = row && row.querySelector(".copy-btn");
      if (copyBtn) copyText(copyBtn.dataset.copy || "", null);
    });
  });
  content.querySelectorAll(".att-download").forEach((btn) => {
    btn.addEventListener("click", () => {
      const att = item.attachments.find((a) => a.id === btn.dataset.attId);
      if (!att || !att.data_base64) return;
      const bytes = b64ToBytes(att.data_base64);
      const blob = new Blob([bytes], { type: att.mime_type || "application/octet-stream" });
      const url = URL.createObjectURL(blob);
      const aEl = document.createElement("a");
      aEl.href = url;
      aEl.download = att.name || "attachment";
      aEl.click();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    });
  });
}

function sectionBlock(sec) {
  const block = `<div class="section-block"><h4>${escapeHtml(sec.section_name)}</h4><div class="field-cluster">${
    sec.section_fields.map((f) => extraFieldRow(f)).join("")
  }</div></div>`;
  return [block, "sections"];
}

function maskCard(number) {
  const digits = number.replace(/\D/g, "");
  const visible = digits.slice(-4);
  return "\u2022".repeat(Math.max(digits.length - 4, 0)) + visible;
}
function attachmentIcon(mime) {
  let id = "ic-file-lines";
  if (mime && mime.startsWith("image/")) id = "ic-image";
  else if (mime && mime.startsWith("video/")) id = "ic-video-camera";
  else if (mime && mime.includes("pdf")) id = "ic-file-lines";
  else if (mime && (mime.includes("zip") || mime.includes("compressed"))) id = "ic-paper-clip";
  return iconSvg(id);
}

function extraFieldRow(f) {
  const c = f.content;
  if (c.type === "totp") {
    return totpRowHtml(c.uri, f.name);
  }
  if (c.type === "hidden") {
    return fieldRow(f.name, "\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022", { rawValue: c.value, reveal: true, masked: true, mono: true, glyphIcon: "ic-eye-slash" });
  }
  if (c.type === "timestamp") {
    const d = new Date(c.unix_seconds * 1000);
    return fieldRow(f.name, escapeHtml(d.toLocaleString()), { copy: false, plain: true, glyphIcon: "ic-clock" });
  }
  return fieldRow(f.name, escapeHtml(c.value), { rawValue: c.value, plain: true, glyphIcon: "ic-pass-all-vaults" });
}

function totpRowHtml(uri, label) {
  return fieldRow(label || "2FA token (TOTP URI)", `<code class="totp-uri">${escapeHtml(uri)}</code>`, { copy: true, rawValue: uri, plain: true, glyphIcon: "ic-clock" });
}

/* ---------------- search ---------------- */
function bindSearch() {
  const input = $("#search");
  const wrap = $("#top-search");
  const doSearch = () => {
    state.search = input.value;
    wrap.classList.toggle("has-text", !!input.value);
    renderList();
  };
  input.addEventListener("input", doSearch);
  input.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") {
      if (input.value) { input.value = ""; doSearch(); }
      else input.blur();
      ev.stopPropagation();
    }
  });
  $("#search-clear").addEventListener("click", () => {
    input.value = "";
    doSearch();
    input.focus();
  });
  document.addEventListener("keydown", (ev) => {
    if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === "f" && !$("#app").classList.contains("hidden")) {
      ev.preventDefault();
      input.focus();
      input.select();
    }
  });
}

/* ---------------- misc ui ---------------- */
function applyThemeIcon() {
  const dark = document.documentElement.getAttribute("data-theme") === "dark";
  const use = document.getElementById("theme-icon");
  if (use) use.setAttribute("href", dark ? "#ic-sun" : "#ic-moon");
}

function bindThemeToggle() {
  applyThemeIcon();
  document.getElementById("theme-toggle").addEventListener("click", () => {
    const dark = document.documentElement.getAttribute("data-theme") === "dark";
    if (dark) {
      document.documentElement.removeAttribute("data-theme");
    } else {
      document.documentElement.setAttribute("data-theme", "dark");
    }
    try { localStorage.setItem("pp-archive-theme", dark ? "light" : "dark"); } catch (e) {}
    applyThemeIcon();
  });
  // Follow live system theme changes while the preference is unset.
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (mq) => {
    let pref = null;
    try { pref = localStorage.getItem("pp-archive-theme"); } catch (e) {}
    if (pref !== "light" && pref !== "dark") {
      if (mq.matches) document.documentElement.setAttribute("data-theme", "dark");
      else document.documentElement.removeAttribute("data-theme");
      applyThemeIcon();
    }
  });
}

function bindChrome() {
  $("#menu-toggle").addEventListener("click", () => {
    if (window.innerWidth <= 900) {
      $("#sidebar").classList.toggle("open");
    } else {
      const sb = $("#sidebar");
      sb.style.display = sb.style.display === "none" ? "flex" : "none";
    }
  });
  window.addEventListener("resize", () => {
    const bodyRow = document.querySelector(".body-row");
    if (window.innerWidth > 900 && bodyRow) bodyRow.classList.remove("has-detail");
  });
}

/* ---------------- boot ---------------- */
(async function boot() {
  bindSearch();
  bindThemeToggle();
  bindChrome();
  if (META.encrypted) {
    showLock();
  } else {
    DATA = JSON.parse(__PAYLOAD_JSON);
    startApp();
  }
})();

</script>
